name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  models:
    name: Model pipeline + regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r ml/requirements.txt
      - name: Export and quantize
        working-directory: ml
        run: |
          python export.py --resolutions 320 640
          python quantize.py --resolutions 320 640
      - name: Regression tests
        working-directory: ml
        run: python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: ml/artifacts/yolo11n_*.onnx

  native:
    name: C++ preprocessing tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        working-directory: android/core/native/src/main/cpp
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

  android:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    needs: models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: models
          path: ml/artifacts
      - name: Unit tests and APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/
